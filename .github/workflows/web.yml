name: Web checks and Pages deployment

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check:
    name: Typecheck, product tests, and browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Preserve released sample contracts
        env:
          REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          let base = process.env.REGISTRY_BASE || '';
          if (/^0+$/.test(base)) base = '';
          if (!base && spawnSync('git', ['rev-parse', '--verify', 'origin/main'], {stdio: 'ignore'}).status === 0) base = 'origin/main';
          if (base && spawnSync('git', ['rev-parse', '--verify', `${base}^{commit}`], {stdio: 'ignore'}).status !== 0) throw new Error('Cannot resolve release registry baseline.');
          const result = spawnSync(process.execPath, ['scripts/check-release-registry.mjs', ...(base ? [base] : [])], {stdio: 'inherit'});
          process.exit(result.status ?? 1);
          NODE
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve independent static app builds
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
