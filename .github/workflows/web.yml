name: Web checks and Pages deployment

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  check:
    name: Typecheck, product tests, and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Preserve released sample contracts
        env:
          REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          let base = process.env.REGISTRY_BASE || '';
          if (/^0+$/.test(base)) base = '';
          if (!base && spawnSync('git', ['rev-parse', '--verify', 'origin/main'], {stdio: 'ignore'}).status === 0) base = 'origin/main';
          if (base && spawnSync('git', ['rev-parse', '--verify', `${base}^{commit}`], {stdio: 'ignore'}).status !== 0) throw new Error('Cannot resolve release registry baseline.');
          const result = spawnSync(process.execPath, ['scripts/check-release-registry.mjs', ...(base ? [base] : [])], {stdio: 'inherit'});
          process.exit(result.status ?? 1);
          NODE
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve independent static app builds
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Preview, report released flows, then deploy main
    needs: check
    # Fork pull requests get all local checks without access to deployment secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'playground' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Check deployment configuration
        id: configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const configured = Boolean(process.env.CLOUDFLARE_ACCOUNT_ID && process.env.CLOUDFLARE_API_TOKEN);
          const source = process.env.SOURCE_REF.toLowerCase().replace(/[^a-z0-9-]+/g, '-').slice(0, 45);
          appendFileSync(process.env.GITHUB_OUTPUT, `configured=${configured}\nbranch=preview-${source}\n`);
          if (!configured) {
            console.log('::warning::Pages deployment skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Web checks passed. Pages deployment requires the Cloudflare account ID and API token secrets. The static build is available in the web-dist artifact.\n');
          }
          NODE
      - name: Download verified static builds
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Deploy branch preview
        if: steps.configuration.outputs.configured == 'true'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.configuration.outputs.branch }}
      - name: Install site checker
        if: steps.configuration.outputs.configured == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Walk the released sample flows on the preview
        if: steps.configuration.outputs.configured == 'true'
        id: site-check
        continue-on-error: true
        env:
          PLAYGROUND_URL: ${{ steps.preview.outputs.deployment-url }}
        run: npm run check:site
      - name: Report preview check outcome
        if: always() && steps.configuration.outputs.configured == 'true' && steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          SITE_CHECK_OUTCOME: ${{ steps.site-check.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview: ${process.env.PREVIEW_URL}\n\nReleased flow site check: **${process.env.SITE_CHECK_OUTCOME}**. This check reports problems and does not block production deployment.\n`);
          if (process.env.SITE_CHECK_OUTCOME !== 'success') console.log('::warning::Preview site check reported a failure. See the site-check report artifact.');
          NODE
      - name: Preserve preview report
        if: always() && steps.configuration.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: site-check-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish the same build to production
        if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.preview.outcome == 'success' && steps.configuration.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
