name: Mobile CI build and release
run-name: Mobile ${{ github.event_name == 'push' && 'release' || 'candidate' }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Candidate platform to verify. Manual runs never publish a release.'
        type: choice
        required: true
        default: all
        options: [all, android, ios]

permissions:
  contents: read

# Each pushed tip gets its own run; a later push cannot cancel an older pending build.
# Published commit releases are immutable; reruns skip an existing verified release.
concurrency:
  group: mobile-release-${{ github.event_name }}-${{ github.sha }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: 'true'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
  MAESTRO_DISABLE_UPDATE_CHECK: 'true'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'

jobs:
  prepare:
    name: Prepare the commit version and publication guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft releases are visible only with repository push access. This job only reads them.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      native-version: ${{ steps.version.outputs.native-version }}
      build-number: ${{ steps.version.outputs.build-number }}
      ios-build-number: ${{ steps.version.outputs.ios-build-number }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Derive the commit version and protect existing releases
        id: version
        env:
          GH_TOKEN: ${{ secrets.MOBILE_RELEASE_TOKEN || github.token }}
        run: node scripts/mobile-release.mjs prepare
      - run: npm ci
      - run: npm test
      - run: npm run test:mobile:flows
      - run: node --test tests/mobile/*.test.mjs tests/mobile/ios/offline-*.test.mjs
      - run: npm run typecheck --workspace @playground/mobile

  android:
    name: Build and attest the Android APK
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && (github.event_name == 'push' || inputs.platform != 'ios')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PLAYGROUND_VERSION: ${{ needs.prepare.outputs.version }}
      PLAYGROUND_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build a standalone release APK
        id: build
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Preserve the compiled APK for diagnostic retests
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-android-apk-unverified
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Verify final APK identity, release version, permissions and architectures
        run: |
          node --input-type=module <<'NODE'
          import {inspectApk} from './tests/mobile/inspect-apk.mjs';
          inspectApk('mobile/android/app/build/outputs/apk/release/app-release.apk', undefined, {
            versionName: process.env.PLAYGROUND_VERSION,
            versionCode: process.env.PLAYGROUND_BUILD_NUMBER,
          });
          NODE
      - name: Install the pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const digest = createHash('sha256').update(readFileSync(`${process.env.RUNNER_TEMP}/maestro.zip`)).digest('hex');
          if (digest !== '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a') throw new Error('Maestro archive checksum mismatch.');
          appendFileSync(process.env.GITHUB_PATH, `${process.env.RUNNER_TEMP}/maestro/bin\n`);
          NODE
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify product journeys on the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            mkdir -p maestro-reports/android
            node tests/mobile/run-diagnostic.mjs android emulator-5554 all
      - name: Preserve Android acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-acceptance-report
          path: maestro-reports/android/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stage the APK and its SHA-256 checksum
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/playground-android-${PLAYGROUND_VERSION}.apk"
          cd release
          sha256sum "playground-android-${PLAYGROUND_VERSION}.apk" > "playground-android-${PLAYGROUND_VERSION}.apk.sha256"
      - name: Attest Android build provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-release
          path: release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  ios:
    name: Build and attest the iOS simulator app
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && (github.event_name == 'push' || inputs.platform != 'android')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PLAYGROUND_VERSION: ${{ needs.prepare.outputs.version }}
      PLAYGROUND_NATIVE_VERSION: ${{ needs.prepare.outputs.native-version }}
      PLAYGROUND_BUILD_NUMBER: ${{ needs.prepare.outputs.ios-build-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - run: npm ci
      - name: Install native iOS dependencies
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Pin the Node executable for Xcode script phases
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('mobile/ios/.xcode.env.local', `export NODE_BINARY="${process.execPath}"\n`);
          NODE
      - name: Build the unsigned universal simulator app
        id: build
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace Playground.xcworkspace \
            -scheme Playground \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' \
            MARKETING_VERSION="$PLAYGROUND_NATIVE_VERSION" \
            CURRENT_PROJECT_VERSION="$PLAYGROUND_BUILD_NUMBER" \
            build
      - name: Package the compiled simulator app for diagnostic retests
        id: diagnostic-package
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/ios/build/Build/Products/Release-iphonesimulator/Playground.app \
            "diagnostics/playground-ios-simulator-${PLAYGROUND_VERSION}-unverified.zip"
      - name: Preserve the unverified simulator app
        if: steps.diagnostic-package.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ios-simulator-unverified
          path: diagnostics/*.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Verify simulator identity, release version and architectures
        run: |
          node --input-type=module <<'NODE'
          import {inspectIosApp} from './tests/mobile/inspect-ios.mjs';
          inspectIosApp('mobile/ios/build/Build/Products/Release-iphonesimulator/Playground.app', undefined, {
            shortVersion: process.env.PLAYGROUND_NATIVE_VERSION,
            bundleVersion: process.env.PLAYGROUND_BUILD_NUMBER,
          });
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const digest = createHash('sha256').update(readFileSync(`${process.env.RUNNER_TEMP}/maestro.zip`)).digest('hex');
          if (digest !== '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a') throw new Error('Maestro archive checksum mismatch.');
          appendFileSync(process.env.GITHUB_PATH, `${process.env.RUNNER_TEMP}/maestro/bin\n`);
          NODE
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
      - name: Boot an iOS 18.5 simulator and install the release app
        id: simulator
        run: |
          PLAYGROUND_SIMULATOR_ID=$(xcrun simctl create 'Playground CI' 'com.apple.CoreSimulator.SimDeviceType.iPhone-16' 'com.apple.CoreSimulator.SimRuntime.iOS-18-5')
          echo "id=$PLAYGROUND_SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$PLAYGROUND_SIMULATOR_ID"
          xcrun simctl bootstatus "$PLAYGROUND_SIMULATOR_ID" -b
          xcrun simctl install "$PLAYGROUND_SIMULATOR_ID" mobile/ios/build/Build/Products/Release-iphonesimulator/Playground.app
      - name: Verify product journeys, native URLs and touch dragging on the simulator build
        env:
          PLAYGROUND_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: node tests/mobile/run-diagnostic.mjs ios "$PLAYGROUND_SIMULATOR_ID" all
      - name: Preserve iOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-report
          path: |
            maestro-reports/ios/
            !maestro-reports/ios/gesture-build/**
            !maestro-reports/ios/offline/*/build/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Shut down the test simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          PLAYGROUND_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: xcrun simctl shutdown "$PLAYGROUND_SIMULATOR_ID"
      - name: Package the simulator app and checksum
        run: |
          mkdir -p release
          test -d mobile/ios/build/Build/Products/Release-iphonesimulator/Playground.app
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/ios/build/Build/Products/Release-iphonesimulator/Playground.app \
            "release/playground-ios-simulator-${PLAYGROUND_VERSION}.zip"
          cd release
          shasum -a 256 "playground-ios-simulator-${PLAYGROUND_VERSION}.zip" > "playground-ios-simulator-${PLAYGROUND_VERSION}.zip.sha256"
      - name: Attest iOS build provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-release
          path: release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: mobile/ios/build/Logs/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish both artifacts once
    needs: [prepare, android, ios]
    if: needs.prepare.outputs.publish == 'true' && needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.MOBILE_RELEASE_TOKEN || github.token }}
      MOBILE_TAG: ${{ needs.prepare.outputs.tag }}
      PLAYGROUND_VERSION: ${{ needs.prepare.outputs.version }}
      PLAYGROUND_NATIVE_VERSION: ${{ needs.prepare.outputs.native-version }}
      PLAYGROUND_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      PLAYGROUND_IOS_BUILD_NUMBER: ${{ needs.prepare.outputs.ios-build-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*-release
          merge-multiple: true
          path: release
      - name: Verify both checksums before publication
        working-directory: release
        run: |
          test -s "playground-android-${PLAYGROUND_VERSION}.apk"
          test -s "playground-ios-simulator-${PLAYGROUND_VERSION}.zip"
          sha256sum --check "playground-android-${PLAYGROUND_VERSION}.apk.sha256"
          sha256sum --check "playground-ios-simulator-${PLAYGROUND_VERSION}.zip.sha256"
      - name: Publish this commit with both binaries, checksums and manifest
        # gh stages a draft, uploads all assets, then publishes. No upload --clobber
        # or release edit operation is used. Enable repository release immutability.
        run: node scripts/mobile-release.mjs publish
