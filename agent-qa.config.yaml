workspace:
  testMatch:
    - tests/agent-qa/web/*.yaml
    - tests/agent-qa/mobile/*.yaml
  suiteMatch:
    - tests/agent-qa/suites/*.suite.yaml
  hooksFile: hooks.yaml
  agentRules: agent-rules.md
  envFile: .env
  secretsFile: .env.secrets.local

services:
  dashboard:
    port: 3470
    dbPath: .agent-qa/dashboard.sqlite
    artifactsDir: tests/agent-qa/reports/artifacts
  mcp:
    enabled: false
  recording:
    enabled: true
  memory:
    enabled: true
    provider: local
    dir: .agent-qa/memory
    curatorEnabled: true
  logging:
    level: warn

registry:
  llms:
    - name: playground-codex
      provider: openai-subscription
      model: gpt-6.1-sol
      screenshotSize: 200kb
      effectiveResolution: 1280
  targets:
    web-komazon:
      product: komazon
      platform: web
      url: https://playground.vostride.dev/shop/
    web-looking:
      product: looking
      platform: web
      url: https://playground.vostride.dev/flights/
    web-brello:
      product: brello
      platform: web
      url: https://playground.vostride.dev/tasks/
    web-pepapog:
      product: pepapog
      platform: web
      url: https://playground.vostride.dev/observability/
    android-komazon:
      product: komazon
      platform: android
      appPackage: dev.vostride.playground
      appActivity: .MainActivity
    android-looking:
      product: looking
      platform: android
      appPackage: dev.vostride.playground
      appActivity: .MainActivity
    android-brello:
      product: brello
      platform: android
      appPackage: dev.vostride.playground
      appActivity: .MainActivity
    android-pepapog:
      product: pepapog
      platform: android
      appPackage: dev.vostride.playground
      appActivity: .MainActivity
    ios-komazon:
      product: komazon
      platform: ios
      bundleId: dev.vostride.playground
    ios-looking:
      product: looking
      platform: ios
      bundleId: dev.vostride.playground
    ios-brello:
      product: brello
      platform: ios
      bundleId: dev.vostride.playground
    ios-pepapog:
      product: pepapog
      platform: ios
      bundleId: dev.vostride.playground
  devices:
    android-local:
      platform: android
      transport: local
      match: {}
    ios-local:
      platform: ios
      transport: local
      match: {}

plugins:
  auth:
    - package: '@vostride/agent-qa-subscription-auth'

use:
  llm: playground-codex
  parallel: false
  cache: false
  browser:
    name: chromium
    headless: true
    viewport:
      width: 1440
      height: 900
  mobile:
    appState: reset
  timeout:
    step: 2m
    test: 20m
    navigation: 1m
  healing:
    maxAttempts: 2
  planner:
    maxSubActions: 15
    previousStepCount: 5
  logCapture:
    console: false
    network: false

analytics:
  privacy: true
