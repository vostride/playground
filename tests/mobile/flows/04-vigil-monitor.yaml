appId: dev.vostride.playground
name: PepaPog range, live metrics, log facets and refresh, span inspection, monitor validation and persistence, both bug controls
---
- runFlow: ../helpers/launch.yaml
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://observability/logs
- assertVisible:
    id: vigil-field-log-search-query
- runFlow: ../helpers/obs-logs-and-live.yaml
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://observability/monitors
- runFlow: ../helpers/obs-monitors.yaml
- assertVisible: '^No matching monitors$'
- assertNotVisible: '^Deliberate bug:.*'
- takeScreenshot: pepapog-monitor-deleted-bugs-disabled
