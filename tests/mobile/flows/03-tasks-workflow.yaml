appId: dev.vostride.playground
name: Brello boards, task properties, refresh, move, undo, and both bug switches
---
- runFlow: ../helpers/launch.yaml
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks
- runFlow: ../helpers/tasks-browse-refresh.yaml
- tapOn:
    id: task-new-button
- tapOn:
    id: task-create-title
- inputText: Native regression task
- runFlow: ../helpers/dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-create-submit
    direction: DOWN
- tapOn:
    id: task-create-submit
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks/task/CKB-2401
- assertVisible:
    id: task-detail-title
    text: Native regression task
- longPressOn:
    id: task-detail-title
- tapOn:
    text: '(?i)^Select all$'
- eraseText: 1
- inputText: Native regression task edited
- assertVisible:
    id: task-detail-title
    text: '^Native regression task edited$'
- runFlow: ../helpers/dismiss-keyboard.yaml
- tapOn:
    id: task-status-progress
- assertVisible:
    id: task-status-progress
    selected: true
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-detail-undo
    direction: DOWN
- tapOn:
    id: task-detail-undo
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-status-todo
    direction: UP
- assertVisible:
    id: task-status-todo
    selected: true
- runFlow: ../helpers/tasks-accessible-order.yaml
- runFlow: ../helpers/tasks-edit-properties.yaml
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: task-checklist-new
      VALUE: Confirm mobile flow
- tapOn:
    id: task-checklist-add
- assertVisible: '^Confirm mobile flow$'
# In iOS run 39151281803 the custom checkbox changed its accessible value to
# "checkbox, checked", while Maestro still normalized checked to false.
# Copy from the exact item label so these value checks cannot match another row.
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom: '^Confirm mobile flow$'
      - evalScript: ${if (maestro.copiedText !== 'checkbox, unchecked') throw new Error('Confirm mobile flow must start unchecked')}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: '^Confirm mobile flow$'
          checked: false
- tapOn: '^Confirm mobile flow$'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: '^Confirm mobile flow$'
      - copyTextFrom: '^Confirm mobile flow$'
      - evalScript: ${if (maestro.copiedText !== 'checkbox, checked') throw new Error('Confirm mobile flow must be checked after tapping')}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: '^Confirm mobile flow$'
          checked: true
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-detail-done
    direction: DOWN
- tapOn:
    id: task-detail-done
- extendedWaitUntil:
    notVisible: '^Close CKB-2401$'
    timeout: 10000
- assertVisible:
    id: task-search
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks/task/CKB-2401
- assertVisible:
    id: task-detail-title
    text: '^Native regression task edited$'
- scrollUntilVisible:
    centerElement: true
    element:
      text: '^Confirm mobile flow$'
    direction: DOWN
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: '^Confirm mobile flow$'
      - copyTextFrom: '^Confirm mobile flow$'
      - evalScript: ${if (maestro.copiedText !== 'checkbox, checked') throw new Error('Confirm mobile flow must stay checked after reopening')}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: '^Confirm mobile flow$'
          checked: true
- takeScreenshot: corkboard-task-persisted
- runFlow: ../helpers/tasks-assert-properties.yaml
- runFlow: ../helpers/tasks-filter-bug.yaml
- runFlow: ../helpers/tasks-move-bug.yaml
- takeScreenshot: brello-expanded-acceptance-complete
