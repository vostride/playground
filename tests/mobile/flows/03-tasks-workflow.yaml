appId: dev.vostride.playground
name: Brello create, edit, move, undo, checklist, and persistence
---
- runFlow: ../helpers/launch.yaml
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks
- tapOn:
    id: task-new-button
- tapOn:
    id: task-create-title
- inputText: Native regression task
- runFlow: ../helpers/dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-create-submit
    direction: DOWN
- tapOn:
    id: task-create-submit
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks/task/CKB-2401
- assertVisible:
    id: task-detail-title
    text: Native regression task
- longPressOn:
    id: task-detail-title
- tapOn:
    text: '(?i)^Select all$'
- eraseText: 1
- inputText: Native regression task edited
- assertVisible:
    id: task-detail-title
    text: '^Native regression task edited$'
- runFlow: ../helpers/dismiss-keyboard.yaml
- tapOn:
    id: task-status-progress
- assertVisible:
    id: task-status-progress
    selected: true
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-detail-undo
    direction: DOWN
- tapOn:
    id: task-detail-undo
- scrollUntilVisible:
    centerElement: true
    element:
      id: task-status-todo
    direction: UP
- assertVisible:
    id: task-status-todo
    selected: true
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: task-checklist-new
      VALUE: Confirm mobile flow
- tapOn:
    id: task-checklist-add
- assertVisible: Confirm mobile flow
- tapOn: Confirm mobile flow
- assertVisible:
    text: Confirm mobile flow
    checked: true
- scrollUntilVisible:
    centerElement: true
    element:
      text: Done
    direction: DOWN
- tapOn: Done
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://tasks/task/CKB-2401
- assertVisible:
    id: task-detail-title
    text: '^Native regression task edited$'
- scrollUntilVisible:
    centerElement: true
    element:
      text: Confirm mobile flow
    direction: DOWN
- assertVisible:
    text: Confirm mobile flow
    checked: true
- takeScreenshot: corkboard-task-persisted
