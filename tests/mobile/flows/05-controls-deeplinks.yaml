appId: dev.vostride.playground
name: Home and tab navigation, Back, WebView, deep links, bug recovery, all-product reset and process restart
---
- runFlow: ../helpers/launch.yaml
- runFlow:
    file: ../helpers/controls-navigation.yaml
    env:
      PHASE: fresh-install
- runFlow: ../helpers/controls-cart-total.yaml
- runFlow:
    file: ../helpers/controls-mutate-products.yaml
    env:
      PHASE: before-reset
- runFlow:
    file: ../helpers/controls-enable-bugs.yaml
    env:
      PHASE: before-reset
- tapOn: '^Test controls$'
- scrollUntilVisible:
    element:
      id: button-reset-playground-session
    direction: DOWN
    centerElement: true
- tapOn:
    id: button-reset-playground-session
- assertVisible:
    id: home-open-shop
- runFlow:
    file: ../helpers/controls-baseline.yaml
    env:
      PHASE: after-reset
# Mutate every app again. The next launch stops the process without clearState,
# proving restart semantics independently of the visible reset control.
- tapOn:
    id: tab-shop
- assertVisible:
    id: field-search-products
- runFlow: ../helpers/add-two-mugs.yaml
- scrollUntilVisible:
    element:
      text: '^\$53\.00$'
    direction: DOWN
    centerElement: true
- assertVisible: '^\$53\.00$'
- takeScreenshot: before-restart-cart-53
- runFlow:
    file: ../helpers/controls-mutate-products.yaml
    env:
      PHASE: before-restart
- runFlow:
    file: ../helpers/controls-enable-bugs.yaml
    env:
      PHASE: before-restart
- runFlow: ../helpers/controls-restart.yaml
- runFlow:
    file: ../helpers/controls-baseline.yaml
    env:
      PHASE: after-restart
- assertVisible:
    id: home-open-shop
- assertNotVisible: '^Deliberate bug:.*'
- takeScreenshot: controls-restart-complete
