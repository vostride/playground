appId: dev.vostride.playground
name: Komazon sign-in, quantity, validated checkout, and cancellation
---
- runFlow: ../helpers/launch.yaml
- runFlow:
    file: ../helpers/open-link.yaml
    env:
      LINK: playground://shop
- runFlow: ../helpers/add-two-mugs.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      text: '\$53\.00'
    direction: DOWN
- assertVisible: '\$53\.00'
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-continue-to-checkout
    direction: DOWN
- tapOn:
    id: button-continue-to-checkout
- assertVisible:
    id: shop-signin-heading
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: field-email-address
      VALUE: alex@example.com
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: field-password
      VALUE: komazon123
- scrollUntilVisible:
    centerElement: true
    element:
      id: shop-submit-signin
    direction: DOWN
- tapOn:
    id: shop-submit-signin
- assertVisible: 'Shipping address'
# Verify a blank address cannot advance to delivery.
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-continue-to-delivery
    direction: DOWN
- tapOn:
    id: button-continue-to-delivery
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Enter a street address\.[\s\S]*'
    direction: UP
- assertVisible: 'Enter a street address\.[\s\S]*'
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: field-street-address
      VALUE: 12 Demo Street
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: field-city
      VALUE: Portland
- runFlow:
    file: ../helpers/fill.yaml
    env:
      FIELD: field-postal-code
      VALUE: '97205'
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-continue-to-delivery
    direction: DOWN
- tapOn:
    id: button-continue-to-delivery
- assertVisible: 'Delivery method'
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-review-order
    direction: DOWN
- tapOn:
    id: button-review-order
- assertVisible:
    id: shop-review-heading
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Everyday Ceramic Mug × 2'
    direction: DOWN
- assertVisible: 'Everyday Ceramic Mug × 2'
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-place-order-53-00
    direction: DOWN
- tapOn:
    id: button-place-order-53-00
- assertVisible: 'Order confirmed'
- assertVisible: 'Your order FW-1001 is confirmed\.'
- tapOn:
    id: button-view-orders
- assertVisible: 'Order FW-1001'
- assertVisible: 'Total \$53\.00'
- scrollUntilVisible:
    centerElement: true
    element:
      id: button-cancel-order
    direction: DOWN
- tapOn:
    id: button-cancel-order
- assertVisible: 'Cancel order FW-1001\?'
- tapOn:
    id: button-confirm-cancellation
- assertVisible: 'Cancelled'
- takeScreenshot: fernwood-order-cancelled
