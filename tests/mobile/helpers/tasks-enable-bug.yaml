appId: dev.vostride.playground
---
- tapOn: '^Test controls$'
- scrollUntilVisible:
    element:
      text: '^Brello: ${BUG_LABEL}$'
    direction: DOWN
    centerElement: true
- assertVisible:
    text: '^Brello: ${BUG_LABEL}$'
    checked: false
- tapOn: '^Brello: ${BUG_LABEL}$'
- assertVisible:
    text: '^Brello: ${BUG_LABEL}$'
    checked: true
- scrollUntilVisible:
    element:
      id: button-close-controls
    direction: DOWN
    centerElement: true
- tapOn:
    id: button-close-controls
- assertVisible: '^Deliberate bug: ${BUG_LABEL}$'
