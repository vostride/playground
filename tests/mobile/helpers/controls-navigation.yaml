appId: dev.vostride.playground
---
# Every Home button must open its own product; the visible Back control must
# restore Home rather than only changing the product route.
- scrollUntilVisible:
    element:
      id: home-open-shop
    direction: UP
    centerElement: true
- tapOn:
    id: home-open-shop
- assertVisible:
    id: field-search-products
- assertVisible:
    id: shop-tab-catalog
    selected: true
- tapOn:
    id: navigation-back
- assertVisible:
    id: home-open-shop
- scrollUntilVisible:
    element:
      id: home-open-flights
    direction: DOWN
    centerElement: true
- tapOn:
    id: home-open-flights
- assertVisible: '^Flight search$'
- assertVisible:
    id: flight-tab-search
    selected: true
- tapOn:
    id: navigation-back
- assertVisible:
    id: home-open-shop
- scrollUntilVisible:
    element:
      id: home-open-tasks
    direction: DOWN
    centerElement: true
- tapOn:
    id: home-open-tasks
- assertVisible:
    id: task-search
- assertVisible:
    id: task-view-board
    selected: true
- tapOn:
    id: navigation-back
- assertVisible:
    id: home-open-shop
- scrollUntilVisible:
    element:
      id: home-open-observability
    direction: DOWN
    centerElement: true
- tapOn:
    id: home-open-observability
- extendedWaitUntil:
    visible: '^Production overview$'
    timeout: 10000
- assertVisible:
    id: vigil-tab-overview
    selected: true
- tapOn:
    id: navigation-back
- assertVisible:
    id: home-open-shop
# This invokes the OS hardware Back path, independently of the header button.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: home-open-flights
      - assertVisible: '^Flight search$'
      - pressKey: back
      - assertVisible:
          id: home-open-shop
# Product switching uses the header chooser. Each dedicated footer must render
# its functional destination as well as updating its selected state.
- runFlow:
    file: switch-product.yaml
    env:
      APP: shop
- assertVisible:
    id: field-search-products
- assertVisible:
    id: shop-tab-catalog
    selected: true
- tapOn:
    id: shop-tab-cart
- assertVisible: '^Your bag \(0\)$'
- assertVisible: '^Your bag is empty$'
- assertVisible:
    id: shop-tab-cart
    selected: true
# Reselecting the current tab must not add a duplicate Back-stack entry.
- tapOn:
    id: shop-tab-cart
- assertVisible: '^Your bag [(]0[)]$'
- tapOn:
    id: navigation-back
- assertVisible:
    id: field-search-products
- assertVisible:
    id: shop-tab-catalog
    selected: true
- tapOn:
    id: shop-tab-orders
- assertVisible: '^Your orders$'
- assertVisible: '^Sign in to see your orders$'
- assertVisible:
    id: shop-tab-orders
    selected: true
# Authentication stays in the Orders context and Back restores that page.
- tapOn:
    id: button-sign-in-to-see-your-orders
- assertVisible:
    id: shop-signin-heading
- assertVisible:
    id: shop-tab-orders
    selected: true
- tapOn:
    id: navigation-back
- assertVisible: '^Your orders$'
- assertVisible: '^Sign in to see your orders$'
- assertVisible:
    id: shop-tab-orders
    selected: true
- tapOn:
    id: shop-tab-profile
- assertVisible: '^Profile$'
- assertVisible: '^Sign in to manage your orders and shipping details[.]$'
- assertVisible:
    id: shop-tab-profile
    selected: true
- tapOn:
    id: shop-tab-catalog
- assertVisible:
    id: field-search-products
- assertVisible:
    id: shop-tab-catalog
    selected: true
- runFlow:
    file: switch-product.yaml
    env:
      APP: flights
- assertVisible: '^Flight search$'
- assertVisible:
    id: flight-tab-search
    selected: true
- tapOn:
    id: flight-tab-bookings
- assertVisible: '^Booking WL6P2K$'
- assertVisible:
    id: flight-tab-bookings
    selected: true
- tapOn:
    id: flight-tab-search
- assertVisible:
    id: flight-from-picker
- assertVisible:
    id: flight-tab-search
    selected: true
- runFlow:
    file: switch-product.yaml
    env:
      APP: tasks
- assertVisible:
    id: task-search
- assertVisible:
    id: task-view-board
    selected: true
- tapOn:
    id: task-view-list
- assertVisible:
    id: task-list
- assertVisible:
    id: task-card-CKB-001
- assertVisible:
    id: task-view-list
    selected: true
- tapOn:
    id: task-view-board
- assertVisible:
    id: task-card-CKB-001
- assertVisible:
    id: task-view-board
    selected: true
- runFlow:
    file: switch-product.yaml
    env:
      APP: observability
- extendedWaitUntil:
    visible: '^Production overview$'
    timeout: 10000
- assertVisible:
    id: vigil-tab-overview
    selected: true
- tapOn:
    id: vigil-tab-logs
- assertVisible:
    id: vigil-field-log-search-query
- assertVisible:
    id: vigil-tab-logs
    selected: true
- tapOn:
    id: vigil-tab-traces
- assertVisible: '^Distributed traces$'
- assertVisible:
    id: vigil-tab-traces
    selected: true
- tapOn:
    id: vigil-tab-monitors
- assertVisible: '^New monitor$'
- assertVisible:
    id: vigil-tab-monitors
    selected: true
- tapOn:
    id: vigil-tab-overview
- assertVisible: '^Production overview$'
- assertVisible:
    id: vigil-tab-overview
    selected: true
- runFlow:
    file: switch-product.yaml
    env:
      APP: home
- assertVisible:
    id: home-open-shop
# Keep native URL coverage on Android. The mandatory NativeLinkTests companion
# exercises the same URL/query contract on iOS; its business routes use UI here.
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://flights
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://flights/bookings
- assertVisible: '^Booking WL6P2K$'
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://observability
- assertVisible: '^Production overview$'
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://observability/logs
- assertVisible:
    id: vigil-field-log-search-query
- runFlow: controls-timestamp.yaml
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://observability/monitors
- assertVisible: '^New monitor$'
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://tasks/task/CKB-001
- assertVisible:
    id: task-detail-title
- tapOn: '^Close CKB-001$'
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://home
- scrollUntilVisible:
    element:
      id: button-a-quick-guide-to-the-playground
    direction: DOWN
    centerElement: true
- tapOn:
    id: button-a-quick-guide-to-the-playground
- assertVisible: '^Help$'
# The cold iOS WebView may mount its native sheet before rendering local HTML.
# Require content readiness without reopening the sheet or retrying the flow.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: '^Navigation$'
          timeout: 60000
- assertVisible: '^Navigation$'
- takeScreenshot: local-webview-guide
- tapOn:
    id: button-close
- assertVisible:
    id: home-open-shop
# Preserve explicit bug-query routing coverage and restore its switch before
# the separate normal -> enabled -> disabled cart-total behavior checks.
- runFlow:
    file: open-link.yaml
    env:
      LINK: playground://shop?bug=cart-total
- assertVisible: '^Deliberate bug: Quantity ignored in totals$'
- tapOn: '^Test controls$'
- assertVisible:
    id: bug-shop-cart-total
    checked: true
- tapOn:
    id: bug-shop-cart-total
- assertVisible:
    id: bug-shop-cart-total
    checked: false
- scrollUntilVisible:
    element:
      id: button-close-controls
    direction: DOWN
    centerElement: true
- tapOn:
    id: button-close-controls
- assertNotVisible: '^Deliberate bug: Quantity ignored in totals$'
- assertVisible:
    id: field-search-products
