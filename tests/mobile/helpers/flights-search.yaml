appId: dev.vostride.playground
---
# Change the origin through the actual autocomplete sheet.
- tapOn:
    id: flight-from-picker
- runFlow:
    file: fill.yaml
    env:
      FIELD: field-search-airports
      VALUE: SFO
- tapOn:
    id: flight-airport-SFO
- assertVisible:
    id: flight-from-picker
    text: '^From: San Francisco [(]SFO[)]$'
# The picker must persist dates outside the seed month in both directions.
# Select all before replacing the populated date; tapping alone may put the
# caret inside the value and leave a suffix after eraseText.
- tapOn:
    id: flight-dates-picker
- longPressOn:
    id: flight-exact-travel-date
- tapOn: '(?i)^Select all$'
- eraseText: 1
- inputText: '2032-06-12'
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: button-use-date
- tapOn:
    id: button-done
- extendedWaitUntil:
    notVisible:
      id: flight-exact-travel-date
    timeout: 10000
- tapOn:
    id: flight-dates-picker
- assertVisible:
    id: flight-exact-travel-date
    text: '^2032-06-12$'
- assertVisible: '^June 2032$'
- takeScreenshot: looking-future-date-persisted
- longPressOn:
    id: flight-exact-travel-date
- tapOn: '(?i)^Select all$'
- eraseText: 1
- inputText: '2024-04-12'
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: button-use-date
- tapOn:
    id: button-done
- extendedWaitUntil:
    notVisible:
      id: flight-exact-travel-date
    timeout: 10000
- tapOn:
    id: flight-dates-picker
- assertVisible:
    id: flight-exact-travel-date
    text: '^2024-04-12$'
- assertVisible: '^April 2024$'
- takeScreenshot: looking-past-date-persisted
# Return to the original month and departure tab before the existing calendar
# interaction. Its Nov 12–19 itinerary and downstream quote checks stay intact.
- longPressOn:
    id: flight-exact-travel-date
- tapOn: '(?i)^Select all$'
- eraseText: 1
- inputText: '2026-11-10'
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: button-use-date
- tapOn:
    id: chip-departure-nov-10
- assertVisible:
    id: flight-exact-travel-date
    text: '^2026-11-10$'
- assertVisible: '^November 2026$'
# Choose both dates and check the return-date constraint before completing it.
- scrollUntilVisible:
    element:
      text: '^2026-11-12$'
    direction: DOWN
    centerElement: true
- tapOn: '^2026-11-12$'
- assertVisible:
    text: '^2026-11-11$'
    enabled: false
- tapOn: '^2026-11-19$'
- assertVisible:
    id: flight-dates-picker
    text: '^Travel dates: Nov 12 – Nov 19$'
- tapOn:
    id: flight-travelers-picker
- assertVisible:
    id: button-remove-traveler
    enabled: false
- tapOn:
    id: button-add-traveler
- assertVisible:
    id: flight-traveler-count
    text: '^2$'
- assertVisible:
    id: button-remove-traveler
    enabled: true
- tapOn:
    id: button-done
- assertVisible:
    id: flight-travelers-picker
    text: '^Travelers: 2 adults$'
- scrollUntilVisible:
    element:
      id: button-search-flights
    direction: DOWN
    centerElement: true
- tapOn:
    id: button-search-flights
- assertVisible: '^San Francisco → London$'
- assertVisible: '^Nov 12 · 2 travelers · Outbound flight$'
- scrollUntilVisible:
    element:
      id: flight-results-count
    direction: DOWN
    centerElement: true
- assertVisible:
    id: flight-results-count
    text: '^12 flights found$'
- scrollUntilVisible:
    element:
      id: flight-open-filters
    direction: UP
    centerElement: true
- tapOn:
    id: flight-open-filters
# iOS exposes both the static label and the switch with this text. Run
# 39148819893 tapped the label, so target the control to its right explicitly.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Nonstop only$'
          rightOf: '^Nonstop only$'
          checked: false
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '^Nonstop only$'
          checked: false
- assertVisible:
    text: '^Nonstop only$'
    checked: true
- scrollUntilVisible:
    element:
      id: flight-apply-filters
    direction: DOWN
    centerElement: true
- tapOn:
    id: flight-apply-filters
- extendedWaitUntil:
    notVisible:
      id: flight-nonstop-filter
    timeout: 10000
- scrollUntilVisible:
    element:
      id: flight-results-count
    direction: DOWN
    centerElement: true
- assertVisible:
    id: flight-results-count
    text: '^5 flights found$'
# Prove both sort orders by the resulting first flight, not only the chip state.
- scrollUntilVisible:
    element:
      id: flight-open-sort
    direction: UP
    centerElement: true
- tapOn:
    id: flight-open-sort
- tapOn:
    id: chip-earliest-departure
- extendedWaitUntil:
    notVisible:
      id: chip-earliest-departure
    timeout: 10000
- scrollUntilVisible:
    element:
      id: flight-result-0-summary
    direction: DOWN
    centerElement: true
- assertVisible:
    id: flight-result-0-summary
    text: '^Meridian Air MD 177$'
- scrollUntilVisible:
    element:
      id: flight-open-sort
    direction: UP
    centerElement: true
- tapOn:
    id: flight-open-sort
- tapOn:
    id: chip-lowest-price
- extendedWaitUntil:
    notVisible:
      id: chip-lowest-price
    timeout: 10000
- scrollUntilVisible:
    element:
      id: flight-result-0-price
    direction: DOWN
    centerElement: true
- assertVisible:
    id: flight-result-0-summary
    text: '^Atlas Pacific AP 180$'
- assertVisible:
    id: flight-result-0-price
    text: '^\$465 / traveler$'
# The visible earlier day changes the quote from $465 to $501.
- scrollUntilVisible:
    element:
      id: flight-price-date-2026-11-11
    direction: UP
    centerElement: true
- tapOn:
    id: flight-price-date-2026-11-11
- assertVisible:
    id: flight-price-date-2026-11-11
    selected: true
- scrollUntilVisible:
    element:
      id: flight-result-0-price
    direction: DOWN
    centerElement: true
- assertVisible:
    id: flight-result-0-summary
    text: '^Atlas Pacific AP 180$'
- assertVisible:
    id: flight-result-0-price
    text: '^\$501 / traveler$'
- takeScreenshot: looking-search-filter-sort-date-price
