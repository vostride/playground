appId: dev.vostride.playground
env:
  UI_ROUTE: '${LINK.split("?")[0]}'
  UI_TASK_ID: '${LINK.split("/").pop().split("?")[0]}'
  UI_APP: '${LINK.replace("playground://", "").split("/")[0].split("?")[0]}'
---
# The chooser resets the route without unmounting the current product, preserving
# Brello's component-local undo stack and filters while closing any prior route.
- runFlow:
    file: switch-product.yaml
    env:
      APP: '${UI_APP}'
- runFlow:
    when:
      true: '${UI_ROUTE === "playground://shop/cart"}'
    commands:
      - tapOn:
          id: shop-tab-cart
- runFlow:
    when:
      true: '${LINK === "playground://shop?bug=cart-total"}'
    commands:
      - tapOn: '^Test controls$'
      - tapOn: '^Komazon: Quantity ignored in totals$'
      - scrollUntilVisible:
          element:
            id: button-close-controls
          direction: DOWN
          centerElement: true
      - tapOn:
          id: button-close-controls
      - assertVisible: '^Deliberate bug: Quantity ignored in totals$'
- runFlow:
    when:
      true: '${UI_ROUTE === "playground://flights/bookings"}'
    commands:
      - tapOn:
          id: flight-tab-bookings
- runFlow:
    when:
      true: '${UI_ROUTE === "playground://observability/logs"}'
    commands:
      - tapOn:
          id: vigil-tab-logs
- runFlow:
    when:
      true: '${UI_ROUTE === "playground://observability/monitors"}'
    commands:
      - tapOn:
          id: vigil-tab-monitors
- runFlow:
    when:
      true: '${UI_ROUTE.indexOf("playground://tasks/task/") === 0}'
    commands:
      - extendedWaitUntil:
          visible: '^Search tasks$'
          timeout: 10000
      - tapOn:
          id: task-view-list
      # iOS exposes offscreen list rows as visible in its accessibility tree.
      # Search the exact ID so the card is inside the list viewport before tapping.
      - tapOn: '^Search tasks$'
      - eraseText
      - inputText: '${UI_TASK_ID}'
      - runFlow: dismiss-keyboard.yaml
      - extendedWaitUntil:
          visible:
            id: 'task-card-${UI_TASK_ID}'
          timeout: 10000
      - tapOn:
          id: 'task-card-${UI_TASK_ID}'
