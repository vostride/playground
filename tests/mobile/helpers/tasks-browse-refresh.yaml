appId: dev.vostride.playground
---
# Choose a real board, then traverse all 30 tasks through the rendered list.
- tapOn: '^Browse all boards$'
- tapOn:
    id: task-board-option-board-2
- assertVisible:
    id: task-board-title
    text: 'Platform · Cycle 1'
- tapOn:
    id: task-view-list
- assertVisible:
    id: task-card-CKB-031
- scrollUntilVisible:
    element:
      id: task-card-CKB-060
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    id: task-card-CKB-060
- assertNotVisible:
    id: task-card-CKB-031
- takeScreenshot: brello-long-list-last-task
- scrollUntilVisible:
    element:
      id: task-card-CKB-031
    direction: UP
    centerElement: false
    timeout: 60000
# Return to the top using the list's side gutter, outside the draggable cards.
# The point is relative to the matched viewport, below the fixed header.
- swipe:
    from:
      id: task-list
      point: '2%, 10%'
    direction: DOWN
    duration: 600
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: task-card-CKB-031
# Pull again from the top. Bound settling so the six-second completion notice
# remains observable; a visible first card alone does not prove a refresh.
- swipe:
    from:
      id: task-list
      point: '2%, 10%'
    direction: DOWN
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '^Board is up to date$'
    timeout: 10000
- assertVisible:
    id: task-card-CKB-031
- takeScreenshot: brello-pull-to-refresh-complete
# The six-second toast can expire while Maestro settles a tap, opening a row beneath it.
# Refresh was proved above; wait for the notification to leave before choosing another board.
- extendedWaitUntil:
    notVisible: '^Dismiss notification$'
    timeout: 10000
- tapOn: '^Browse all boards$'
- tapOn:
    id: task-board-option-board-1
- assertVisible:
    id: task-board-title
    text: Product launch
