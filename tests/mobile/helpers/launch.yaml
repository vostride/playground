appId: dev.vostride.playground
---
# A failed prior scenario may leave the native deep-link dialog above the app.
# Cancel only that known dialog before the normal clean-session launch; the
# original scenario failure is retained in the suite report.
- runFlow:
    when:
      platform: iOS
      visible: 'Open.*Playground.*'
    commands:
      - tapOn: '^Cancel$'
      - extendedWaitUntil:
          notVisible: 'Open.*Playground.*'
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: deny
# The emulator's Pixel Launcher can leave its own ANR above the launched app.
# Match that system app exactly; Playground and other ANRs must still fail.
- runFlow:
    when:
      platform: Android
      visible: "^Pixel Launcher isn't responding$"
    commands:
      - tapOn: '^Close app$'
      - extendedWaitUntil:
          notVisible: "^Pixel Launcher isn't responding$"
          timeout: 10000
# Product/session state is process-local (the Map in ui.tsx). Restart iOS
# without clearState's uninstall/reinstall, preserving installed URL-scheme
# registration while retaining a clean seeded session.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          permissions:
            all: deny
- extendedWaitUntil:
    visible: 'Make yourself at home\.'
    timeout: 30000
- assertVisible: 'PLAYGROUND.*Simulated data.*'
