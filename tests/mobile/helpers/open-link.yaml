appId: dev.vostride.playground
env:
  # A route-specific landmark prevents a warm link from returning while the old
  # app screen is still visible. Keep this whitelist aligned with suite routes.
  LINK_DESTINATION: >-
    ${LINK.indexOf('playground://tasks/task/') === 0
      ? 'Close ' + LINK.split('/').pop().split('?')[0]
      : ({
          'playground://home': 'Open Komazon',
          'playground://shop': 'Search products',
          'playground://shop/cart': 'Your bag [(][0-9]+[)]',
          'playground://flights': 'Flight search',
          'playground://flights/bookings': 'Find a booking',
          'playground://tasks': 'Search tasks',
          'playground://observability/logs': 'Log search query',
          'playground://observability/monitors': 'New monitor'
        })[LINK.split('?')[0]]}
---
# Android retains actual custom-scheme navigation. iOS business scenarios use
# the visible app controls; mandatory NativeLinkTests separately covers URL
# delivery and query flags through XCUIApplication.open on the same candidate.
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: '${LINK}'
- runFlow:
    when:
      platform: iOS
    file: navigate-ios.yaml
# Every route still requires its actual product landmark on both platforms.
- extendedWaitUntil:
    visible: '${LINK_DESTINATION}'
    timeout: 30000
