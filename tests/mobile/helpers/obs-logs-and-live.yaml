appId: dev.vostride.playground
---
# Range changes must alter the actual result set, not just the picker label.
- assertVisible:
    id: vigil-log-count
    text: '^224 logs found$'
- tapOn:
    id: vigil-select-time-range
- tapOn:
    id: vigil-option-time-range-24h
- assertVisible:
    id: vigil-log-count
    text: '^5,187 logs found$'
# This is the 45th production event, beyond initialNumToRender=18.
# Android run 39146156938 found it at 28.8s; the final centering swipe exceeded
# the old 30s limit. Allow 45s for this traversal and its return to the header.
- scrollUntilVisible:
    element:
      id: vigil-log-000049
    direction: DOWN
    centerElement: true
    timeout: 45000
- tapOn:
    id: vigil-log-000049
- assertVisible: '^Log event$'
- assertVisible:
    id: vigil-selected-event-id
    text: '^log-000049$'
- tapOn: '^Close$'
- scrollUntilVisible:
    element:
      id: vigil-field-log-search-query
    direction: UP
    centerElement: false
    timeout: 45000
# Pull the actual list; the completion notice is emitted only by onRefresh.
- swipe:
    from:
      id: vigil-log-list
    direction: DOWN
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '^Telemetry refreshed\.$'
    timeout: 8000
- assertVisible:
    id: vigil-log-count
    text: '^5,187 logs found$'
- takeScreenshot: pepapog-long-list-refreshed
# Pause after refresh (manual refresh intentionally advances telemetry too).
- tapOn:
    id: vigil-tab-overview
- tapOn:
    id: vigil-live-updates
- assertVisible: '^Paused$'
- scrollUntilVisible:
    element:
      id: vigil-metric-request-rate
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-metric-request-rate
    text: '^[0-9,]+ req/s$'
- copyTextFrom:
    id: vigil-metric-request-rate
- evalScript: ${output.obsPausedRate = maestro.copiedText}
- tapOn:
    id: vigil-tab-logs
# Apply status AND service facets with an empty query: 5,187 -> 62 events.
- tapOn: '^Filters$'
- tapOn:
    id: vigil-filter-level-error
- scrollUntilVisible:
    element:
      id: vigil-filter-service-checkout
    direction: DOWN
    centerElement: true
- tapOn:
    id: vigil-filter-service-checkout
- scrollUntilVisible:
    element:
      text: '^Apply filters$'
    direction: DOWN
    centerElement: true
- tapOn: '^Apply filters$'
- assertVisible:
    id: vigil-log-count
    text: '^62 logs found$'
- assertVisible: '^Filters \(2\)$'
# Also exercise the query parser while both selected facets remain applied.
- runFlow:
    file: fill.yaml
    env:
      FIELD: vigil-field-log-search-query
      VALUE: 'service:checkout status:error'
- tapOn: '^Search$'
- assertVisible:
    id: vigil-log-count
    text: '^62 logs found$'
# Normal -> enabled -> documented failure -> disabled -> normal.
# The defect ignores status in both the query and facets, admitting 898 checkout
# events including the first INFO event. Disabling must restore exactly 62 errors.
- runFlow:
    file: obs-toggle-bug.yaml
    env:
      OBS_BUG_LABEL: '^PepaPog: Broken log status filter$'
- assertVisible: '^Deliberate bug: Broken log status filter$'
- assertVisible:
    id: vigil-log-count
    text: '^898 logs found$'
- scrollUntilVisible:
    element:
      id: vigil-log-000007
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-log-000007
    text: '^info checkout Cache refreshed for product catalog$'
- takeScreenshot: pepapog-log-filter-bug-enabled
- runFlow:
    file: obs-toggle-bug.yaml
    env:
      OBS_BUG_LABEL: '^PepaPog: Broken log status filter$'
- assertNotVisible: '^Deliberate bug: Broken log status filter$'
- scrollUntilVisible:
    element:
      id: vigil-log-count
    direction: UP
    centerElement: false
- assertVisible:
    id: vigil-log-count
    text: '^62 logs found$'
- scrollUntilVisible:
    element:
      id: vigil-log-000079
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-log-000079
    text: '^error checkout Database connection acquisition failed$'
- tapOn:
    id: vigil-log-000079
- assertVisible: '^Log event$'
- scrollUntilVisible:
    element:
      text: '^View trace$'
    direction: DOWN
    centerElement: true
- tapOn: '^View trace$'
- assertVisible: '^Trace details$'
- assertVisible: '^Trace waterfall$'
# Inspect the payment span, then require attributes from its detail panel.
- scrollUntilVisible:
    element:
      id: vigil-span-78-4
    direction: DOWN
    centerElement: true
- tapOn:
    id: vigil-span-78-4
- assertVisible:
    id: vigil-span-78-4
    selected: true
- scrollUntilVisible:
    element:
      id: vigil-span-detail-service
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-span-detail-service
    text: '^payment-worker$'
- assertVisible:
    id: vigil-span-detail-duration
    text: '^169 ms$'
- scrollUntilVisible:
    element:
      id: vigil-span-detail-http-status-code
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-span-detail-http-status-code
    text: '^503$'
- takeScreenshot: pepapog-waterfall-span-details
- tapOn: '^Close$'
# All preceding modal/list actions exceed the five-second live interval. The
# same rendered metric must remain unchanged while paused, then change on resume.
- tapOn:
    id: vigil-tab-overview
- assertVisible: '^Paused$'
- scrollUntilVisible:
    element:
      id: vigil-metric-request-rate
    direction: DOWN
    centerElement: true
- assertVisible:
    id: vigil-metric-request-rate
    text: '^${output.obsPausedRate}$'
- tapOn:
    id: vigil-live-updates
- assertVisible: '^Live$'
- extendedWaitUntil:
    notVisible:
      id: vigil-metric-request-rate
      text: '^${output.obsPausedRate}$'
    timeout: 15000
- assertVisible:
    id: vigil-metric-request-rate
    text: '^[0-9,]+ req/s$'
- takeScreenshot: pepapog-live-metric-resumed
