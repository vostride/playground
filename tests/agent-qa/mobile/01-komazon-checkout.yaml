test-id: t_photo-pivot-reload-unci-robe-icho-posit-teste-mall-ulu
name: Komazon mobile purchase, order history, and cancellation
target: android-komazon
context: >-
  Exercise the installed Playground app through its visible native controls.
  The account and address below are public fixture data. Reset through Test controls
  at the start so this journey is independent of other tests. Keep deliberate bugs off.
  Scroll within the current content area to reach controls. After entering text,
  use Done typing if the keyboard covers the next control. Never replace an assertion
  with a state change that manufactures its expected result.
use:
  device: android-local
  mobile:
    appState: reset
meta:
  timeout: 20m
steps:
  - Open Test controls in the app header, select Reset playground session, and verify Home shows the four product choices.
  - Open Komazon from Home and verify the Shop tab is selected and the catalog contains Everyday Ceramic Mug.
  - Search the catalog for Everyday Ceramic Mug and open that product's details.
  - Verify the product price is $24.00, then add one mug to the cart.
  - Open the Cart bottom tab and increase the mug quantity to 2.
  - Verify the cart contains exactly two Everyday Ceramic Mugs, subtotal $48.00, delivery $5.00, and total $53.00.
  - Tap the Cart bottom tab again, then use the app header Back button once. Verify the catalog is displayed and Shop is the selected bottom tab.
  - Return to Cart and continue to checkout. Verify the Sign in form appears.
  - Sign in with email alex@example.com and password komazon123. Verify Shipping address is displayed.
  - Leave the street address, city, and postal code empty and press Continue to delivery. Verify the form stays on Shipping address and shows Enter a street address.
  - Enter street address 12 Demo Street, city Portland, and postal code 97205. Keep the United States country selection, then continue to delivery.
  - Keep standard delivery and choose Review order. Verify the review contains Everyday Ceramic Mug × 2 and total $53.00.
  - Place the $53.00 order. Verify Order confirmed and the order reference FW-1001 are displayed.
  - Choose View orders and verify Order FW-1001 has total $53.00 and is not cancelled.
  - Cancel order FW-1001 and confirm cancellation in its confirmation dialog. Verify that order now shows Cancelled.
  - Open the Shop bottom tab, then return to Orders. Verify FW-1001 still shows Cancelled and total $53.00.
