<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Playground · Vostride</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header>
      <h1>Playground</h1>
    </header>
    <main>
      <nav class="apps" aria-label="Applications">
        <a href="/shop/" class="app-link"
          ><span class="symbol shop"
            ><img src="/brands/shop.svg" alt="" width="28" height="28" /></span
          ><span>Komazon</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/flights/" class="app-link"
          ><span class="symbol flights"
            ><img src="/brands/flights.svg" alt="" width="28" height="28" /></span
          ><span>Looking.com</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/observability/" class="app-link"
          ><span class="symbol observability"
            ><img src="/brands/observability.svg" alt="" width="28" height="28" /></span
          ><span>PepaPog</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/tasks/" class="app-link"
          ><span class="symbol tasks"
            ><img src="/brands/tasks.svg" alt="" width="28" height="28" /></span
          ><span>Brello</span><span class="arrow" aria-hidden="true">→</span></a
        >
      </nav>
    </main>
  </body>
</html>
