<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Playground · Vostride</title>
    <link rel="icon" type="image/svg+xml" href="/brands/playground-icon.svg" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header>
      <img src="/brands/playground.svg" alt="" width="24" height="29" />
      <h1>Playground</h1>
    </header>
    <main>
      <nav class="apps" aria-label="Applications">
        <a href="/shop/" class="app-link"
          ><span class="symbol shop"
            ><img src="/brands/shop.svg" alt="" width="28" height="28" /></span
          ><span>Komazon</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/flights/" class="app-link"
          ><span class="symbol flights"
            ><img src="/brands/flights.svg" alt="" width="28" height="28" /></span
          ><span>Looking</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/observability/" class="app-link"
          ><span class="symbol observability"
            ><img src="/brands/observability.svg" alt="" width="32" height="32" /></span
          ><span>PepaPog</span><span class="arrow" aria-hidden="true">→</span></a
        >
        <a href="/tasks/" class="app-link"
          ><span class="symbol tasks"
            ><img src="/brands/tasks.svg" alt="" width="28" height="28" /></span
          ><span>Brello</span><span class="arrow" aria-hidden="true">→</span></a
        >
      </nav>
      <a
        class="agent-banner"
        href="https://vostride.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="agent-qa. Test web and mobile apps. Opens in a new browser tab."
      >
        <span class="agent-banner-content">
          <img src="/brands/agent-qa.png" alt="agent-qa" width="148" height="25" />
          <span>Test web and mobile apps.</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </main>
    <footer>
      <a
        href="https://vostride.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="by Vostride. Opens in a new browser tab."
        >by Vostride</a
      >
    </footer>
  </body>
</html>
